name: webpack-dev-server

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jest test path pattern (empty = full suite)"
        required: false
        default: ""

jobs:
  test:
    name: Test - ${{ matrix.os }} - Node v${{ matrix.node-version }}, Webpack ${{ matrix.webpack-version }}

    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        node-version: [12.x, 14.x, 16.x, 17.x]
        webpack-version: [latest]
        exclude:
          - os: macos-latest
            node-version: 12.x
          - os: macos-latest
            node-version: 14.x
        include:
          - node-version: 16.x
            os: ubuntu-latest
            webpack-version: 4

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update package.json for webpack@4
        if: matrix.webpack-version == '4'
        run: echo "`jq '.scripts.build="npm run build:client"' package.json`" > package.json

      - name: Install webpack ${{ matrix.webpack-version }}
        if: matrix.webpack-version == '4'
        run: npm i webpack@${{ matrix.webpack-version }} --save-dev --ignore-scripts

      - name: Link webpack-dev-server
        run: |
          cp -R client tmp-client
          npm link --ignore-scripts
          npm link webpack-dev-server --ignore-scripts
          rm -r client
          cp -R tmp-client client

      - name: Run tests for webpack version ${{ matrix.webpack-version }}
        run: npm run test:coverage -- --ci --verbose ${{ inputs.test-filter }}

      - name: Explain upstream test skips
        if: always()
        shell: bash
        run: |
          echo "Skipped tests and reasons (every skip is hard-coded upstream; the build adds none except the macOS e2e ignore):"
          echo "- test/cli/host-option.test.js 'should work using --host <IPv6>': upstream it.skip (IPv6 unavailable on CI runners)"
          echo "- test/cli/basic.test.js 'should use different random port ... different processes': upstream it.skip (racy across processes)"
          echo "- test/cli/basic.test.js 'should generate correct cli flags': upstream skips on macOS (isMacOS ? it.skip)"
          echo "- test/e2e/ipc.test.js 'ipc option using string value and remove old' x2 (sockjs/ws): upstream it.skip (TODO new API)"
          echo "- test/e2e/lazy-compilation.test.js single/multiple entries: upstream it.skip (eventsource freeze), whole suite reported skipped"
          echo "- test/e2e/server.test.js + test/e2e/https.test.js symlink cases: upstream skipTestOnWindows (symlinks unsupported on Windows)"
          echo "- webpack5Test / itOnlyWebpack5 / describeOnlyWebpack5 cases (cli/basic, e2e/entry, e2e/module-federation): skipped on the Webpack 4 leg only"
          echo "- macOS only: test/e2e/ ignored via jest.config.js (puppeteer 13 Chromium hangs on arm64 macOS runners)"

  pack:
    name: Pack - ubuntu-latest - Node v16.14.0

    timeout-minutes: 30

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 16.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 16.14.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: webpack-dev-server-tgz
          path: webpack-dev-server-4.8.1.tgz
          if-no-files-found: error
